plugins { id 'java' }
repositories {
    maven { url 'https://repo.runelite.net'; content { includeGroupByRegex('net\\.runelite.*') } }
    mavenCentral()
}
dependencies {
    compileOnly 'net.runelite:client:latest.release'
    testImplementation 'net.runelite:client:latest.release'
    testImplementation 'junit:junit:4.13.2'
}
tasks.withType(JavaCompile).configureEach { options.release.set(11) }
tasks.register('run', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.lumbylabs.routes.Launcher'
    args '--developer-mode'
}
